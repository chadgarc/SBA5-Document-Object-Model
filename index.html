<!DOCTYPE html data-theme="dark">
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Object Model</title>
    
    <link rel="stylesheet" href="./css/output.css">

    <link rel="stylesheet" href="./css/main.css">
    <script src="./script/app.js" defer></script>
</head>
<body class="w-full min-h-screen m-0">

    <main class="pt-15 gap-9 mx-auto">
        <header class="grid grid-cols-1 md:grid-cols-3 w-full gap-10">

            <section class="flex flex-col col-span-2 mt-10 name-headliner gap-5 px-7">
                <h1 class="text-center font-bold text-5xl ">Christian's Blog</h1>
                <p class="headliner">Aspiring software developer, videogames player, and more</p>
            </section>
            
            <section class="profile_photo_container grid place-items-center mx-0">
                <img class="profile_photo" src="./assets/profile-photo.webp" alt="User's photo">
            </section>
            
        </header>

        <nav class="flex justify-center flex-wrap gap-5 top-0 sticky z-50 backdrop-blur px-7 navbar">
            <a class="nav-group" href="#homepage">Home</a>
            <a class="nav-group" href="#">LinkedIn</a>
            <a class="nav-group" href="#">Github</a>
            <a class="nav-group" href="#">Portfolio</a>
            <a class="nav-group" href="#">Frontend Mentors</a>
        </nav>

        <section class="flex justify-center">
            <button class="btn btn-Style rounded-3xl" onclick="post_modal.showModal()">Post +</button>
        </section>
        
        <section class="flex flex-1 flex-col mx-auto w-3/4">

            <!-- Post container template, hidden by default -->
            <article id="" class="posts flex-col gap-3 mt-7 mb-7 border-2 border-black p-7 rounded-3xl hidden">
                <header class="flex gap-3">
                    <h2 class="me-auto post-title">
                        
                    </h2>
                    <button class="btn btn-Style rounded-3xl px-3 py-1 editBtn" onclick="edit_modal.showModal()">Edit</button>
                    <button class="btn deleteBtn btn-Style px-3 py-1 rounded-2xl">Delete</button>
                </header>
                <p class="post-content">
                    
                </p>
            </article>
            
        </section>

        <!-- MODAL FOR NEW CONTENT -->
        <dialog id="post_modal" class="modal">
            <div class="modal-box">
                <!-- Content -->
                <form action="">
                    <h2>Adding New Post:</h2>
                    <label class="floating-label mt-6 mb-3">
                        <span class="font-bold text-xl">Title: </span>
                        <input type="text" class="input input-primary" placeholder="Enter title" />
                    </label>
                    <span class="font-bold text-sm text-error hidden">Cannot be empty</span>

                    <label class="floating-label mt-5 mb-3">
                        <span class="font-bold text-xl">Content: </span>
                        <textarea class="textarea textarea-primary" placeholder="Enter Content"></textarea>
                    </label>
                    <span class="font-bold text-sm text-error mb-2 hidden">Cannot be empty</span>
                    
                    <div class="modal-action">
                        <form method="dialog">
                            <!-- if there is a button in form, it will close the modal -->
                            <button class="btn btn-Style rounded-3xl">Close</button>
                        </form>
                        <button type="submit" class="btn btn-Style rounded-3xl">Post</button>
                    </div>
                </form>
            </div>
        </dialog>
        
        
        <!-- MODAL FOR EDIT CONTENT -->
        <dialog id="edit_modal" class="modal">
            <div class="modal-box">
                <!-- Content -->
                <form action="">
                    <h2>Edit Post:</h2>
                    <label class="floating-label mt-6 mb-3">
                        <span class="font-bold text-xl">Title: </span>
                        <input type="text" class="input input-primary" placeholder="Enter title" />
                    </label>
                    <span class="font-bold text-sm text-error hidden">Cannot be empty</span>

                    <label class="floating-label mt-5 mb-3">
                        <span class="font-bold text-xl">Content: </span>
                        <textarea class="textarea textarea-primary" placeholder="Enter Content"></textarea>
                    </label>
                    <span class="font-bold text-sm text-error mb-2 hidden">Cannot be empty</span>
                    
                    <div class="modal-action">
                        <form method="dialog">
                            <!-- if there is a button in form, it will close the modal -->
                            <button class="btn btn-Style rounded-3xl">Cancel</button>
                        </form>
                        <button type="submit" class="btn btn-Style rounded-3xl">Save Changes</button>
                    </div>
                </form>
            </div>
        </dialog>

    </main>
    
</body>
</html>
